<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}白读 · ByRead{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <script>
    /* 主题预置：避免刷新时白屏闪烁。localStorage 优先于服务端设置（切换时两者都会写） */
    (function () {
      try {
        var t = localStorage.getItem('byread-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-view-mode="{{ view_mode or 'card' }}">
  {% block body %}{% endblock %}
  <div class="toast-host" id="toast-host"></div>

  <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
